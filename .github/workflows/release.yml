name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Validate release inputs
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY)) {
            throw 'Repository secret TAURI_SIGNING_PRIVATE_KEY is required.'
          }
          $version = '${{ github.ref_name }}'.TrimStart('v')
          $packageVersion = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($packageVersion -ne $version) {
            throw "Tag ${{ github.ref_name }} does not match package version $packageVersion."
          }
      - name: Configure Rust
        shell: pwsh
        run: rustup default stable
      - name: Install dependencies
        run: npm ci
      - name: Build signed Windows updater
        run: npm run tauri -- build --bundles nsis
      - name: Collect Windows assets
        shell: pwsh
        run: |
          $version = '${{ github.ref_name }}'.TrimStart('v')
          $installer = Get-ChildItem 'src-tauri\target\release\bundle\nsis\*.exe' | Select-Object -First 1
          if (-not $installer -or -not (Test-Path -LiteralPath "$($installer.FullName).sig")) {
            throw 'Windows installer or updater signature was not generated.'
          }
          New-Item -ItemType Directory -Force release | Out-Null
          Copy-Item -LiteralPath $installer.FullName -Destination "release\GitSyncTools_${version}_x64-setup.exe"
          Copy-Item -LiteralPath "$($installer.FullName).sig" -Destination "release\GitSyncTools_${version}_x64-setup.exe.sig"
      - uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: release/
          if-no-files-found: error

  build-macos:
    runs-on: macos-14
    timeout-minutes: 60
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Validate release inputs
        shell: bash
        run: |
          test -n "$TAURI_SIGNING_PRIVATE_KEY" || { echo 'Repository secret TAURI_SIGNING_PRIVATE_KEY is required.' >&2; exit 1; }
          version="${GITHUB_REF_NAME#v}"
          package_version="$(node -p "require('./package.json').version")"
          test "$package_version" = "$version" || { echo "Tag $GITHUB_REF_NAME does not match package version $package_version." >&2; exit 1; }
      - name: Configure Rust
        shell: bash
        run: |
          rustup default stable
          rustup target add aarch64-apple-darwin
      - name: Install dependencies
        run: npm ci
      - name: Build signed Apple Silicon updater
        run: npm run tauri -- build --target aarch64-apple-darwin --bundles app,dmg
      - name: Collect macOS assets
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          bundle="src-tauri/target/aarch64-apple-darwin/release/bundle"
          archive="$(find "$bundle/macos" -maxdepth 1 -name '*.app.tar.gz' -print -quit)"
          dmg="$(find "$bundle/dmg" -maxdepth 1 -name '*.dmg' -print -quit)"
          test -n "$archive" && test -f "$archive.sig" && test -n "$dmg"
          mkdir -p release
          cp "$archive" "release/GitSyncTools_${version}_aarch64.app.tar.gz"
          cp "$archive.sig" "release/GitSyncTools_${version}_aarch64.app.tar.gz.sig"
          cp "$dmg" "release/GitSyncTools_${version}_aarch64.dmg"
      - uses: actions/upload-artifact@v4
        with:
          name: macos-release
          path: release/
          if-no-files-found: error

  publish:
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: "*-release"
          path: release
          merge-multiple: true
      - name: Generate updater manifest
        shell: pwsh
        run: |
          $version = '${{ github.ref_name }}'.TrimStart('v')
          $baseUrl = 'https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}'
          ./scripts/generate-update-manifest.ps1 `
            -Version $version `
            -WindowsUrl "$baseUrl/GitSyncTools_${version}_x64-setup.exe" `
            -WindowsSignaturePath "release/GitSyncTools_${version}_x64-setup.exe.sig" `
            -MacArm64Url "$baseUrl/GitSyncTools_${version}_aarch64.app.tar.gz" `
            -MacArm64SignaturePath "release/GitSyncTools_${version}_aarch64.app.tar.gz.sig" `
            -Notes "GitSyncTools ${{ github.ref_name }}" `
            -OutputPath 'release/latest.json'
      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" release/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" release/* --title "GitSyncTools $GITHUB_REF_NAME" --generate-notes --latest
          fi
